<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Панель управления</title>
    <link rel="stylesheet" href="/webjars/bootstrap/5.3.2/css/bootstrap.min.css">
    <style>
        .bg-warning {
            background-color: #ffc107 !important;
            transition: all 0.3s;
        }
        .list-group-item-action { cursor: pointer; }
        .navbar-nav .nav-link { cursor: pointer; }
        .badge { padding: 5px 10px; border-radius: 4px; color: white; }
        .bg-warning { background-color: #ffc107; color: black; }
        .bg-success { background-color: #28a745; }
        .bg-danger { background-color: #dc3545; }
        .bg-info { background-color: #17a2b3; }
        .room-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .room-card { width: 100px; height: 100px; border: 1px solid #ccc; border-radius: 8px; text-align: center; padding: 5px; cursor: pointer; transition: 0.2s; }
        .room-free { background-color: #c8e6c9; }
        .room-partial { background-color: #fff9c4; }
        .room-occupied { background-color: #ffcdd2; }
        .room-card:hover { transform: scale(1.05); }
        .room-number { font-weight: bold; font-size: 1.2em; }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="#">Расселение студентов</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto" id="menuItems"></ul>
            <button id="logoutBtn" class="btn btn-outline-light">Выйти</button>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div id="content"></div>
</div>

<script src="/webjars/jquery/3.7.1/jquery.min.js"></script>
<script src="/webjars/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>
<script>
    // -------------------- AJAX with JWT --------------------
    function apiRequest(url, method, data, successCallback, errorCallback) {
        const token = localStorage.getItem('jwtToken');
        console.log('Request:', method, url);
        if (!token && url !== '/api/v1/auth/login') {
            console.error('No token found, redirecting to login');
            window.location.href = '/login';
            return;
        }
        return $.ajax({
            url: url,
            type: method,
            contentType: 'application/json',
            headers: { 'Authorization': 'Bearer ' + token },
            data: data ? JSON.stringify(data) : undefined
        }).done(successCallback).fail(function(xhr) {
            console.error('Request failed:', url, xhr.status, xhr.statusText);
            console.error('Response body:', xhr.responseText);

            if (xhr.status === 401) {
                // Только 401 означает недействительный токен
                alert('Сессия истекла. Пожалуйста, войдите снова.');
                localStorage.removeItem('jwtToken');
                localStorage.removeItem('userId');
                localStorage.removeItem('userRole');
                window.location.href = '/login';
            } else if (xhr.status === 403) {
                // 403 – запрещено, но токен может быть валидным (недостаточно прав, CSRF)
                const errorMsg = xhr.responseJSON?.message || xhr.responseText || 'Доступ запрещён';
                if (errorCallback) {
                    errorCallback(xhr);
                } else {
                    alert('Ошибка: ' + errorMsg);
                }
            } else {
                if (errorCallback) errorCallback(xhr);
                else console.error('API error', xhr);
            }
        });
    }

    function apiRequestPromise(url, method, data) {
        return new Promise((resolve, reject) => {
            apiRequest(url, method || 'GET', data, resolve, reject);
        });
    }

    function apiErrorMessage(xhr) {
        if (xhr.responseJSON && xhr.responseJSON.message) return xhr.responseJSON.message;
        if (xhr.responseText) return xhr.responseText;
        return 'Ошибка ' + xhr.status;
    }

    // -------------------- Глобальные переменные для студента --------------------
    let selectedRoommates = [];
    let allStudents = [];
    let wardenContext = { dormitoryAssigned: false };

    // -------------------- Главная загрузка --------------------
    function loadDashboard() {
        const role = localStorage.getItem('userRole');
        if (!role) {
            window.location.href = '/login';
            return;
        }

        let menuHtml = '';
        if (role === 'STUDENT') {
            menuHtml = `
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadStudentProfile()">Мой профиль</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadMyRequests()">Мои заявки</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showCreateRequestForm()">Подать заявку</a></li>
            `;
        } else if (role === 'WARDEN') {
            menuHtml = `
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadRooms()">Комнаты (таблица)</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadRoomsVisual()">План комнат</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadStudentsToAllocate()">Студенты на заселение</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadAllRequests()">Все заявки</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showAllocationSettings()">Настройки заселения</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="runAllocation()">Запустить распределение</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadStats()">Статистика</a></li>
            `;
        } else if (role === 'ADMIN') {
            menuHtml = `
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadAllUsers()">Пользователи</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="showCreateUserForm()">Создать пользователя</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadRooms()">Комнаты (таблица)</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadRoomsVisual()">План комнат</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="loadStats()">Статистика</a></li>
                <li class="nav-item"><a class="nav-link" href="#" onclick="generateTestData()">Сгенерировать тестовые данные</a></li>
            `;
        }
        $('#menuItems').html(menuHtml);
        if (role === 'STUDENT') loadStudentProfile();
        else if (role === 'WARDEN') loadWardenDashboard();
        else loadCommonProfile();
    }

    function loadWardenDashboard() {
        apiRequest('/api/v1/warden/context', 'GET', null, function(ctx) {
            wardenContext = ctx;
            loadCommonProfile();
        }, function() {
            wardenContext = { dormitoryAssigned: false };
            loadCommonProfile();
        });
    }

    function ensureWardenHasDormitory() {
        if (localStorage.getItem('userRole') !== 'WARDEN') return true;
        if (wardenContext.dormitoryAssigned) return true;
        alert('Вам не назначено общежитие. Администратор должен назначить общежитие в разделе «Пользователи» → «Назначить общ.»');
        return false;
    }

    // -------------------- Профиль студента --------------------
    function loadStudentProfile() {
        apiRequest('/api/v1/students/me', 'GET', null, function(student) {
            $('#content').html(`
                <div class="card">
                    <div class="card-header">Мой профиль (студент)</div>
                    <div class="card-body">
                        <p><strong>ФИО:</strong> ${student.fullName}</p>
                        <p><strong>Email:</strong> ${student.email}</p>
                        <p><strong>Факультет:</strong> ${student.faculty}</p>
                        <p><strong>Группа:</strong> ${student.groupName}</p>
                        <p><strong>Курс:</strong> ${student.course}</p>
                        <p><strong>Пол:</strong> ${student.gender}</p>
                        <p><strong>Страна:</strong> ${student.country}</p>
                        <p><strong>Средний балл:</strong> ${student.averageScore}</p>
                        <p><strong>Телефон:</strong> ${student.phoneNumber || 'не указан'}</p>
                        <p><strong>Льготы:</strong> ${student.benefits.join(', ') || 'нет'}</p>
                    </div>
                </div>
            `);
        });
    }

    // -------------------- Общий профиль (админ/комендант) --------------------
    function loadCommonProfile() {
        apiRequest('/api/v1/users/profile', 'GET', null, function(user) {
            let dormInfo = '';
            if (localStorage.getItem('userRole') === 'WARDEN') {
                dormInfo = wardenContext.dormitoryAssigned
                    ? `<p><strong>Общежитие:</strong> ${wardenContext.dormitoryName}</p>`
                    : `<p class="text-warning"><strong>Общежитие:</strong> не назначено</p>`;
            }
            let html = `
                <div class="card">
                    <div class="card-header">Мой профиль</div>
                    <div class="card-body">
                        <p><strong>ID:</strong> ${user.id}</p>
                        <p><strong>ФИО:</strong> ${user.fullName}</p>
                        <p><strong>Email:</strong> ${user.email}</p>
                        <p><strong>Роли:</strong> ${user.roles.join(', ')}</p>
                        ${dormInfo}
                    </div>
                </div>`;
            if (localStorage.getItem('userRole') === 'WARDEN' && !wardenContext.dormitoryAssigned) {
                html = showWardenNoDormitoryBannerHtml() + html;
            }
            $('#content').html(html);
        });
    }

    function showWardenNoDormitoryBannerHtml() {
        return `<div class="alert alert-warning mb-3">
            <strong>Общежитие не назначено.</strong>
            Попросите администратора: «Пользователи» → «Назначить общ.» для вашей учётной записи.
        </div>`;
    }

    // -------------------- СТУДЕНТ: заявки --------------------
    function loadMyRequests() {
        apiRequest('/api/v1/requests/my', 'GET', null, function(requests) {
            if (!requests || requests.length === 0) {
                $('#content').html('<div class="alert alert-info">У вас нет заявок.</div>');
                return;
            }
            let html = '<h3>Мои заявки</h3><table class="table"><thead><tr><th>ID</th><th>Дата</th><th>Предпочтения (соседи)</th><th>Результат</th><th>Действия</th></tr></thead><tbody>';
            requests.forEach(r => {
                let prefsHtml = r.preferences.map(p => {
                    let mutualBadge = p.mutual ? '<span class="badge bg-info">взаимно</span>' : (p.reversePreferenceExists ? '<span class="badge bg-secondary">ожидает ответа</span>' : '');
                    let reason = p.rejectionReason ? `<small class="text-danger d-block">Причина: ${p.rejectionReason}</small>` : '';
                    return `<div>${p.preferredUserName} ${mutualBadge}
                    <span class="badge ${p.status === 'APPROVED' ? 'bg-success' : (p.status === 'REJECTED' ? 'bg-danger' : 'bg-warning')}">${p.status}</span>
                    ${reason}</div>`;
                }).join('');
                let roommatesHtml = '';
                if (r.allocation && r.allocation.roommates && r.allocation.roommates.length) {
                    roommatesHtml = '<br><small>Соседи: ' + r.allocation.roommates.map(m => m.fullName).join(', ') + '</small>';
                }
                let resultHtml = r.allocation
                    ? `Комната: ${r.allocation.dormitoryName || ''}, ${r.allocation.floor} этаж, №${r.allocation.roomNumber}${roommatesHtml}`
                    : '—';
                html += `<tr>
                        <td>${r.id}</td>
                        <td>${new Date(r.createdAt).toLocaleString()}</td>
                        <td>${prefsHtml}</td>
                        <td>${resultHtml}</td>
                        <td>${r.allocation ? '' : `<button class="btn btn-sm btn-danger" onclick="cancelRequest(${r.id})">Отменить</button>`}</td>
                     </tr>`;
            });
            html += '</tbody><tr>';
            $('#content').html(html);
        });
    }

    function cancelRequest(requestId) {
        apiRequest(`/api/v1/requests/${requestId}`, 'DELETE', null, function() {
            alert('Заявка отменена');
            loadMyRequests();
        });
    }

    // -------------------- Глобальные переменные для студента --------------------

    let currentStudentData = null;

    // -------------------- Создание заявки (исправленная версия) --------------------
    function showCreateRequestForm() {
        selectedRoommates = [];
        // Загружаем данные о текущем студенте
        apiRequest('/api/v1/students/me', 'GET', null, function(me) {
            currentStudentData = me;
            const myUserId = me.userId; // user.id
            // Загружаем список всех студентов (теперь это StudentProfileDto)
            apiRequest('/api/v1/students/list', 'GET', null, function(students) {
                // Фильтруем: исключаем себя, тот же пол и та же страна
                allStudents = students.filter(s =>
                    s.userId !== myUserId &&
                    s.gender === me.gender &&
                    s.country === me.country
                );
                renderCreateRequestForm();
            });
        }, function(err) {
            alert('Ошибка загрузки данных: ' + (err.responseJSON?.message || err.statusText));
        });
    }

    function renderCreateRequestForm() {
        const html = `
        <div class="card">
            <div class="card-header">Создание заявки на расселение</div>
            <div class="card-body">
                <div class="mb-3">
                    <label>Поиск соседей</label>
                    <input type="text" id="searchStudentInput" class="form-control" placeholder="Введите имя..." autocomplete="off">
                    <div id="studentListContainer" class="list-group mt-2" style="max-height: 300px; overflow-y: auto;"></div>
                </div>
                <div class="mb-3">
                    <label>Выбранные соседи (максимум 3)</label>
                    <ul id="selectedRoommatesList" class="list-group"></ul>
                </div>
                <button class="btn btn-primary" onclick="submitRequest()">Подать заявку</button>
                <button class="btn btn-secondary" onclick="loadMyRequests()">Отмена</button>
            </div>
        </div>
    `;
        $('#content').html(html);
        // Обработчик ввода в поле поиска
        $('#searchStudentInput').on('input', function() {
            updateStudentList($(this).val());
        });
        // Первоначальное отображение списка
        updateStudentList('');
        updateSelectedList();
    }

    function updateStudentList(filter) {
        const filterLower = filter.toLowerCase();
        const filtered = allStudents.filter(s => s.fullName.toLowerCase().includes(filterLower));
        let listHtml = '';
        if (filtered.length === 0) {
            listHtml = '<div class="list-group-item">Студенты не найдены</div>';
        } else {
            filtered.forEach(s => {
                const isSelected = selectedRoommates.some(r => r.userId === s.userId);
                listHtml += `
                <div class="list-group-item d-flex justify-content-between align-items-center">
                    ${escapeHtml(s.fullName)} (${escapeHtml(s.groupName || '')}, ${s.course || ''} курс)
                    <button class="btn btn-sm ${isSelected ? 'btn-secondary' : 'btn-primary'}"
                            onclick="${isSelected ? `removeRoommate(${s.userId})` : `addRoommate(${s.userId})`}">
                        ${isSelected ? 'Удалить' : 'Добавить'}
                    </button>
                </div>
            `;
            });
        }
        $('#studentListContainer').html(listHtml);
    }

    function updateSelectedList() {
        if (selectedRoommates.length === 0) {
            $('#selectedRoommatesList').html('<li class="list-group-item">Вы не выбрали ни одного соседа</li>');
            return;
        }
        let selectedHtml = '';
        selectedRoommates.forEach(r => {
            selectedHtml += `
            <li class="list-group-item d-flex justify-content-between align-items-center">
                ${escapeHtml(r.fullName)}
                <button class="btn btn-sm btn-danger" onclick="removeRoommate(${r.userId})">Удалить</button>
            </li>
        `;
        });
        $('#selectedRoommatesList').html(selectedHtml);
    }

    function addRoommate(userId) {
        const student = allStudents.find(s => s.userId === userId);
        if (!student) {
            console.warn('Студент не найден', userId);
            return;
        }
        if (selectedRoommates.length >= 3) {
            alert('Нельзя выбрать больше 3 соседей');
            return;
        }
        if (selectedRoommates.some(r => r.userId === userId)) {
            alert('Этот студент уже выбран');
            return;
        }
        selectedRoommates.push({ userId: student.userId, fullName: student.fullName });
        // Обновляем отображение
        updateStudentList($('#searchStudentInput').val());
        updateSelectedList();
    }

    function removeRoommate(userId) {
        selectedRoommates = selectedRoommates.filter(r => r.userId !== userId);
        updateStudentList($('#searchStudentInput').val());
        updateSelectedList();
    }

    function submitRequest() {
        const preferredUserIds = selectedRoommates.map(r => r.userId);
        if (preferredUserIds.length > 3) {
            alert('Нельзя выбрать больше 3 соседей');
            return;
        }
        const data = { preferredUserIds: preferredUserIds };
        apiRequest('/api/v1/requests', 'POST', data,
            function() {
                alert('Заявка создана');
                loadMyRequests();
            },
            function(xhr) {
                const msg = xhr.responseJSON?.message || 'Не удалось создать заявку';
                alert('Ошибка: ' + msg);
            }
        );
    }

    // Функция экранирования HTML
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    // -------------------- КОМНАТЫ (таблица) --------------------
    function loadRooms() {
        apiRequest('/api/v1/rooms', 'GET', null, function(rooms) {
            let html = '<h3>Комнаты</h3><table class="table">';
            html += '<thead><tr><th>Этаж</th><th>№</th><th>Вместимость</th><th>Тип</th><th>Занято</th><th>Удобства</th><th></th></tr></thead><tbody>';
            rooms.forEach(r => {
                html += `<tr>

                            <td>${r.floor}</td>
                            <td>${r.roomNumber}</td>
                            <td>${r.capacity}</td>
                            <td>${r.type}</td>
                            <td>${r.occupied}</td>
                            <td>${r.facilities.join(', ')}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick="showEditRoomForm(${JSON.stringify(r).replace(/"/g, '&quot;')})">Ред.</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteRoom(${r.id})">Удалить</button>
                            </td>
                         </tr>`;
            });
            html += '</tbody><tr><button class="btn btn-success" onclick="showCreateRoomForm()">Добавить комнату</button>';
            $('#content').html(html);
        });
    }



    function deleteRoom(roomId) {
        if (confirm('Удалить комнату?')) {
            apiRequest(`/api/v1/rooms/${roomId}`, 'DELETE', null, () => loadRooms());
        }
    }

    function showCreateRoomForm() {
        Promise.all([
            apiRequestPromise('/api/v1/admin/dormitories', 'GET'),
            apiRequestPromise('/api/v1/admin/facilities', 'GET')
        ]).then(([dormitories, facilities]) => {
            let dormOptions = dormitories.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
            let facilityCheckboxes = facilities.map(f => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${f.id}" id="facility_${f.id}"> <label class="form-check-label" for="facility_${f.id}">${f.name}</label></div>`).join('');
            $('#content').html(`
            <div class="card">
                <div class="card-header">Новая комната</div>
                <div class="card-body">
                    <div class="mb-2">Общежитие: <select id="dormitoryId" class="form-control">${dormOptions}</select></div>
                    <div class="mb-2">Номер комнаты (например, 303А): <input type="text" id="roomNumber" class="form-control" placeholder="303А"></div>
                    <div class="mb-2">Этаж: <input type="number" id="floor" class="form-control"></div>
                    <div class="mb-2">Вместимость: <input type="number" id="capacity" class="form-control"></div>
                    <div class="mb-2">Тип:
                        <select id="type" class="form-control">
                            <option value="UNDEFINED">Не определён (будет установлен после заселения)</option>
                            <option value="MALE">Мужская</option>
                            <option value="FEMALE">Женская</option>
                        </select>
                    </div>
                    <div class="mb-2">Удобства: <div id="facilitiesGroup">${facilityCheckboxes}</div></div>
                    <button class="btn btn-primary" onclick="createRoom()">Создать</button>
                </div>
            </div>
        `);
        }).catch(err => alert('Ошибка загрузки справочников'));
    }

    function createRoom() {
        const selectedFacilities = [];
        $('#facilitiesGroup input:checked').each(function() {
            selectedFacilities.push($(this).val());
        });
        const data = {
            dormitoryId: parseInt($('#dormitoryId').val()),
            roomNumber: $('#roomNumber').val(),
            floor: parseInt($('#floor').val()),
            capacity: parseInt($('#capacity').val()),
            type: $('#type').val(),
            facilities: selectedFacilities
        };
        apiRequest('/api/v1/rooms', 'POST', data, function() {
            alert('Комната создана');
            loadRooms();
        });
    }

    function showEditRoomForm(room) {
        $('#content').html(`
            <div class="card">
                <div class="card-header">Редактирование комнаты ${room.roomNumber}</div>
                <div class="card-body">
                    <input type="hidden" id="roomId" value="${room.id}">
                    <div class="mb-2">Общежитие: <select id="editDormitoryId" class="form-control"></select></div>
                    <div class="mb-2">Номер комнаты: <input type="text" id="editRoomNumber" value="${room.roomNumber}" class="form-control"></div>
                    <div class="mb-2">Этаж: <input type="number" id="editFloor" value="${room.floor}" class="form-control"></div>
                    <div class="mb-2">Вместимость: <input type="number" id="editCapacity" value="${room.capacity}" class="form-control"></div>
                    <div class="mb-2">Тип:
                        <select id="editType" class="form-control">
                            <option value="UNDEFINED" ${room.type === 'UNDEFINED' ? 'selected' : ''}>Не определён</option>
                            <option value="MALE" ${room.type === 'MALE' ? 'selected' : ''}>Мужская</option>
                            <option value="FEMALE" ${room.type === 'FEMALE' ? 'selected' : ''}>Женская</option>
                        </select>
                    </div>
                    <div class="mb-2">Удобства: <div id="editFacilitiesContainer"></div></div>
                    <button class="btn btn-primary" onclick="updateRoom()">Обновить</button>
                </div>
            </div>
        `);
        Promise.all([
            apiRequestPromise('/api/v1/admin/dormitories', 'GET'),
            apiRequestPromise('/api/v1/admin/facilities', 'GET')
        ]).then(([dormitories, facilities]) => {
            let dormOptions = dormitories.map(d => `<option value="${d.id}" ${room.dormitoryId == d.id ? 'selected' : ''}>${d.name}</option>`).join('');
            $('#editDormitoryId').html(dormOptions);
            let facilityHtml = facilities.map(f => `<div class="form-check"><input class="form-check-input" type="checkbox" value="${f.id}" id="edit_facility_${f.id}" ${room.facilities.includes(f.name) ? 'checked' : ''}> <label class="form-check-label" for="edit_facility_${f.id}">${f.name}</label></div>`).join('');

    // -------------------- План комнат (визуальный) --------------------
    function loadRoomsVisual() {
        apiRequest('/api/v1/rooms', 'GET', null, function(rooms) {
            let dormitories = {};
            rooms.forEach(room => {
                const dormName = room.dormitoryName || 'Неизвестное общежитие';
                if (!dormitories[dormName]) dormitories[dormName] = {};
                const floor = room.floor;
                if (!dormitories[dormName][floor]) dormitories[dormName][floor] = [];
                dormitories[dormName][floor].push(room);
            });
            let html = '<h3>План комнат</h3>';
            for (let dormName in dormitories) {
                html += `<h4>${dormName}</h4>`;
                for (let floor in dormitories[dormName]) {
                    html += `<h5>Этаж ${floor}</h5><div class="room-grid">`;
                    dormitories[dormName][floor].forEach(room => {
                        let statusClass = '';
                        if (room.occupied === 0) statusClass = 'room-free';
                        else if (room.occupied === room.capacity) statusClass = 'room-occupied';
                        else if (room.occupied > 0) statusClass = 'room-partial';
                        html += `<div class="room-card ${statusClass}" data-room-id="${room.id}" onclick="showRoomDetails(${room.id})">
                                <div class="room-number">${room.roomNumber}</div>
                                <div class="room-capacity">${room.occupied}/${room.capacity}</div>
                            </div>`;
                    });
                    html += `</div>`;
                }
            }
            $('#content').html(html);
        });
    }

    function savePreferences(requestId) {
        const row = $(`#content table tr:has(button[onclick*="${requestId}"])`);
        const selects = row.find('select.pref-status');
        let promises = [];
        selects.each(function() {
            const prefId = $(this).data('pref-id');
            const newStatus = $(this).val();
            const reason = row.find(`input.pref-reason[data-pref-id="${prefId}"]`).val();
            if (newStatus === 'REJECTED' && !reason) {
                alert('Укажите причину отклонения для ' + prefId);
                return;
            }
            promises.push(new Promise((resolve, reject) => {
                apiRequest(`/api/v1/warden/preferences/${prefId}`, 'PUT', { status: newStatus, rejectionReason: reason }, resolve, reject);
            }));
        });
        Promise.all(promises).then(() => { alert('Статусы обновлены'); loadAllRequests(); })
            .catch(() => alert('Ошибка при обновлении статусов'));
    }

    // -------------------- АВТОМАТИЧЕСКОЕ РАСПРЕДЕЛЕНИЕ С АНИМАЦИЕЙ --------------------
    function runAllocation() {
        if (!confirm('Запустить автоматическое распределение с визуализацией?')) return;

        const btn = event.target;
        const originalText = $(btn).text();
        $(btn).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Распределение...');

        apiRequest('/api/v1/allocations/auto', 'POST', null, function(result) {
            $(btn).prop('disabled', false).text(originalText);

            const allocations = result.allocations;
            const unallocated = result.unallocatedRequestIds;

            if (!allocations || allocations.length === 0) {
                alert('Нет подходящих комнат для распределения');
                return;
            }

            // Группируем заселения по комнатам (сколько новых жильцов добавлено в каждую комнату)
            const roomChanges = {};
            allocations.forEach(a => {
                if (!roomChanges[a.roomId]) roomChanges[a.roomId] = 0;
                roomChanges[a.roomId]++;
            });

            const roomIds = Object.keys(roomChanges);
            let currentIndex = 0;

            // Функция анимации для следующей комнаты
            function animateNextRoom() {
                if (currentIndex >= roomIds.length) {
                    alert(`Распределение завершено. Заселено: ${allocations.length}, нераспределено: ${unallocated.length}`);
                    loadRoomsVisual(); // финальное обновление плана комнат
                    return;
                }

                const roomId = roomIds[currentIndex];
                const card = $(`.room-card[data-room-id="${roomId}"]`);

                // Подсветка комнаты
                card.addClass('bg-warning');

                // Загружаем актуальные данные комнаты
                apiRequest(`/api/v1/rooms/${roomId}`, 'GET', null, function(room) {
                    // Обновляем текст занятости
                    card.find('.room-capacity').text(`${room.occupied}/${room.capacity}`);

                    // Обновляем класс цвета (зелёный, жёлтый, красный)
                    card.removeClass('room-free room-partial room-occupied');
                    if (room.occupied === 0) card.addClass('room-free');
                    else if (room.occupied === room.capacity) card.addClass('room-occupied');
                    else card.addClass('room-partial');

                    // Убираем подсветку через 0.8 секунды и переходим к следующей комнате
                    setTimeout(() => {
                        card.removeClass('bg-warning');
                        currentIndex++;
                        animateNextRoom();
                    }, 800);
                });
            }

            // Запускаем анимацию
            animateNextRoom();

        }, () => {
            $(btn).prop('disabled', false).text(originalText);
            alert('Ошибка при запуске распределения');
        });
    }

        }
    }

    function showEditStudentForm(userId) {
        if (!userId) return;
        apiRequest(`/api/v1/admin/students/${userId}`, 'GET', null, function(student) {
            Promise.all([
                apiRequestPromise('/api/v1/admin/groups', 'GET'),
                apiRequestPromise('/api/v1/admin/countries', 'GET'),
                apiRequestPromise('/api/v1/admin/benefits', 'GET')
            ]).then(([groups, countries, benefits]) => {
                let groupOptions = groups.map(g => `<option value="${g.id}" ${student.groupId == g.id ? 'selected' : ''}>${g.groupName} (${g.faculty.name})</option>`).join('');
                let countryOptions = countries.map(c => `<option value="${c.id}" ${student.countryId == c.id ? 'selected' : ''}>${c.name}</option>`).join('');
                let benefitHtml = benefits.map(b => `<div><input type="checkbox" value="${b.id}" ${student.benefits.includes(b.name) ? 'checked' : ''}> ${b.name}</div>`).join('');
                $('#content').html(`
                <div class="card">
                    <div class="card-header">Редактирование студента: ${student.fullName}</div>
                    <div class="card-body">
                        <input type="hidden" id="editUserId" value="${userId}">
                        <div class="mb-2">Группа: <select id="editGroupId">${groupOptions}</select></div>
                        <div class="mb-2">Курс: <input type="number" id="editCourse" value="${student.course}"></div>
                        <div class="mb-2">Пол:
                            <select id="editGender">
                                <option value="MALE" ${student.gender === 'MALE' ? 'selected' : ''}>Мужской</option>
                                <option value="FEMALE" ${student.gender === 'FEMALE' ? 'selected' : ''}>Женский</option>
                            </select>
                        </div>
                        <div class="mb-2">Страна: <select id="editCountryId">${countryOptions}</select></div>
                        <div class="mb-2">Средний балл: <input type="number" step="0.01" id="editAvgScore" value="${student.averageScore}"></div>
                        <div class="mb-2">Телефон: <input type="text" id="editPhone" value="${student.phoneNumber || ''}"></div>
                        <div class="mb-2">Льготы: <div id="editBenefits">${benefitHtml}</div></div>
                        <div class="mb-2">Уменьшение баллов за льготы: <input type="number" id="editBenefitAdj" value="${student.benefitBonusAdjustment || 0}" class="form-control"></div>
                        <button class="btn btn-primary" onclick="updateStudent()">Сохранить</button>
                    </div>
                </div>
            `);
            }).catch(() => alert('Ошибка загрузки справочников'));
        });
    }

    function updateStudent() {
        const userId = $('#editUserId').val();
        const data = {
            groupId: parseInt($('#editGroupId').val()),
            course: parseInt($('#editCourse').val()),
            gender: $('#editGender').val(),
            countryId: parseInt($('#editCountryId').val()),
            averageScore: parseFloat($('#editAvgScore').val()),
            phoneNumber: $('#editPhone').val(),
            benefitTypeIds: $('#editBenefits input:checked').map(function() { return parseInt($(this).val()); }).get(),
            benefitBonusAdjustment: parseInt($('#editBenefitAdj').val()) || 0
        };
        apiRequest(`/api/v1/admin/students/${userId}`, 'PUT', data, () => { alert('Данные обновлены'); loadAllUsers(); });
    }

    // -------------------- Создание пользователя (админ) --------------------
    let allGroupsCache = [];

    function showCreateUserForm() {
        $('#content').html('<div class="alert alert-info">Загрузка формы...</div>');
        Promise.all([
            apiRequestPromise('/api/v1/admin/groups', 'GET'),
            apiRequestPromise('/api/v1/admin/faculties', 'GET'),
            apiRequestPromise('/api/v1/admin/countries', 'GET'),
            apiRequestPromise('/api/v1/admin/benefits', 'GET')
        ]).then(([groups, faculties, countries, benefits]) => {
            allGroupsCache = groups || [];
            if (!faculties.length || !allGroupsCache.length) {
                $('#content').html('<div class="alert alert-danger">Нет факультетов или учебных групп в базе. Сначала добавьте справочники.</div>');
                return;
            }
            let facultyOptions = faculties.map(f => `<option value="${f.id}">${f.name}</option>`).join('');
            let countryOptions = countries.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
            let benefitHtml = benefits.map(b => `<div><input type="checkbox" value="${b.id}"> ${b.name} (+${b.priorityBonus})</div>`).join('');
            $('#content').html(`
                <div class="card">
                    <div class="card-header">Создать пользователя</div>
                    <div class="card-body">
                        <input type="text" id="fullName" placeholder="ФИО" class="form-control mb-2">
                        <input type="email" id="email" placeholder="Email" class="form-control mb-2">
                        <input type="password" id="password" placeholder="Пароль" class="form-control mb-2">
                        <div class="mb-2">
                            <label>Роли:</label><br>
                            <input type="checkbox" value="STUDENT" class="role-checkbox-create"> STUDENT
                            <input type="checkbox" value="WARDEN" class="role-checkbox-create"> WARDEN
                            <input type="checkbox" value="ADMIN" class="role-checkbox-create"> ADMIN
                        </div>
                        <div id="studentFieldsCreate" style="display:none;">
                            <label>Факультет:</label>
                            <select id="facultyId" class="form-control mb-2" onchange="filterGroupsForCreate()">${facultyOptions}</select>
                            <label>Курс:</label>
                            <select id="courseFilter" class="form-control mb-2" onchange="filterGroupsForCreate()">
                                <option value="">Все курсы</option>
                                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
                            </select>
                            <label>Группа:</label>
                            <select id="groupId" class="form-control mb-2"></select>
                            <label>Страна:</label>
                            <select id="countryId" class="form-control mb-2">${countryOptions}</select>
                            <select id="gender" class="form-control mb-2">
                                <option value="MALE">Мужской</option>
                                <option value="FEMALE">Женский</option>
                            </select>
                            <input type="number" step="0.01" id="averageScore" placeholder="Средний балл" class="form-control mb-2">
                            <input type="text" id="phoneNumber" placeholder="Телефон" class="form-control mb-2">
                            <label>Льготы:</label>
                            <div id="benefitsList">${benefitHtml}</div>
                        </div>
                        <button class="btn btn-primary" onclick="createUser()">Создать</button>
                    </div>
                </div>
            `);
            $('.role-checkbox-create').change(function() {
                if ($('.role-checkbox-create[value="STUDENT"]').is(':checked')) {
                    $('#studentFieldsCreate').show();
                    filterGroupsForCreate();
                } else $('#studentFieldsCreate').hide();
            });
            filterGroupsForCreate();
        }).catch((xhr) => {
            const msg = xhr && xhr.status ? apiErrorMessage(xhr) : 'Не удалось загрузить справочники';
            alert(msg);
            $('#content').html(`<div class="alert alert-danger">${msg}</div>`);
        });
    }

    function filterGroupsForCreate() {
        const facultyId = parseInt($('#facultyId').val(), 10);
        const course = $('#courseFilter').val();
        const filtered = allGroupsCache.filter(g =>
            g.faculty && g.faculty.id === facultyId && (!course || String(g.course) === course)
        );
        if (!filtered.length) {
            $('#groupId').html('<option value="">— нет групп для выбранного факультета/курса —</option>');
            return;
        }
        $('#groupId').html(filtered.map(g =>
            `<option value="${g.id}">${g.groupName} (${g.faculty.name}, ${g.course} курс)</option>`
        ).join(''));
    }

    function createUser() {
        const roles = $('.role-checkbox-create:checked').map(function() { return $(this).val(); }).get();
        const data = {
            fullName: $('#fullName').val(),
            email: $('#email').val(),
            password: $('#password').val(),
            roles: roles
        };
        if (roles.includes('STUDENT')) {
            data.groupId = parseInt($('#groupId').val());
            data.countryId = parseInt($('#countryId').val());
            data.gender = $('#gender').val();
            data.averageScore = parseFloat($('#averageScore').val());
            data.phoneNumber = $('#phoneNumber').val();
            data.benefitTypeIds = $('#benefitsList input:checked').map(function() { return parseInt($(this).val()); }).get();
        }
        apiRequest('/api/v1/admin/users', 'POST', data, () => { alert('Пользователь создан'); loadAllUsers(); });
    }

    // -------------------- Выход --------------------
    $('#logoutBtn').click(function() {
        localStorage.removeItem('jwtToken');
        localStorage.removeItem('userId');
        localStorage.removeItem('userRole');
        window.location.href = '/login';
    });

    $(document).ready(function() {
        loadDashboard();
    });
</script>
</body>
</html>
