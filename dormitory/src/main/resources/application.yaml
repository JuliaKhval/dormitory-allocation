spring:
  application:
    name: dormitory-allocation
  web:
    resources:
      chain:
        strategy:
          content:
            enabled: true
      static-locations: classpath:/META-INF/resources/webjars/,classpath:/static/
  datasource:
    url: jdbc:postgresql://localhost:5432/dormitory_db
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml
    enabled: true

server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
  packages-to-scan: com.example.dormitory.controller
app:
  jwt:
    secret: mySuperSecretKeyForJwtGenerationThatIsAtLeast32BytesLong
    expiration-ms: 86400000

